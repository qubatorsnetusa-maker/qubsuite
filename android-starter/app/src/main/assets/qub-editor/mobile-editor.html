<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Qub Docs Mobile Editor</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1f2937;
      line-height: 1.6;
      font-size: 16px;
    }
    #editor {
      min-height: calc(100vh - 32px);
      outline: none;
      word-wrap: break-word;
    }
    #editor[contenteditable]:empty:before {
      content: "Start typing your document...";
      color: #9ca3af;
      font-style: italic;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-top: 1.25rem;
      margin-bottom: 0.75rem;
      color: #111827;
      line-height: 1.25;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      color: #1f2937;
    }
    h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 0.875rem;
      margin-bottom: 0.375rem;
      color: #374151;
    }
    p {
      margin-top: 0;
      margin-bottom: 0.75rem;
    }
    ul, ol {
      padding-left: 1.5rem;
      margin-top: 0;
      margin-bottom: 0.75rem;
    }
    li {
      margin-bottom: 0.25rem;
    }
    blockquote {
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
      margin-left: 0;
      margin-right: 0;
      color: #4b5563;
      font-style: italic;
    }
    .task-list {
      list-style: none;
      padding-left: 0;
    }
    .task-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .task-list-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    pre {
      background-color: #f3f4f6;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="editor" contenteditable="true"></div>

  <script>
    (function () {
      const editor = document.getElementById('editor');

      function notifyContentChanged() {
        const text = editor.innerText.trim();
        const firstLine = text.split('\n')[0] || '';

        // Detect document title
        if (firstLine && window.AndroidBridge && window.AndroidBridge.onTitleDetected) {
          window.AndroidBridge.onTitleDetected(firstLine.substring(0, 60));
        }

        // Build simple JSON structure representing document
        const docJson = JSON.stringify({
          type: "doc",
          content: [
            {
              type: "paragraph",
              text: editor.innerHTML
            }
          ]
        });

        if (window.AndroidBridge && window.AndroidBridge.onContentChanged) {
          window.AndroidBridge.onContentChanged(docJson);
        }
      }

      function notifySelectionChanged() {
        const isBold = document.queryCommandState('bold');
        const isItalic = document.queryCommandState('italic');
        const isStrike = document.queryCommandState('strikeThrough');
        const isBulletList = document.queryCommandState('insertUnorderedList');
        const isOrderedList = document.queryCommandState('insertOrderedList');

        const selection = window.getSelection();
        let isHeading1 = false, isHeading2 = false, isHeading3 = false;

        if (selection && selection.rangeCount > 0) {
          let node = selection.getRangeAt(0).startContainer;
          while (node && node !== editor) {
            if (node.nodeName === 'H1') isHeading1 = true;
            if (node.nodeName === 'H2') isHeading2 = true;
            if (node.nodeName === 'H3') isHeading3 = true;
            node = node.parentNode;
          }
        }

        const state = {
          isBold: isBold,
          isItalic: isItalic,
          isStrike: isStrike,
          isHeading1: isHeading1,
          isHeading2: isHeading2,
          isHeading3: isHeading3,
          isBulletList: isBulletList,
          isOrderedList: isOrderedList,
          isTaskList: false,
          isBlockquote: false,
          isCodeBlock: false,
          canUndo: true,
          canRedo: true
        };

        if (window.AndroidBridge && window.AndroidBridge.onSelectionChanged) {
          window.AndroidBridge.onSelectionChanged(JSON.stringify(state));
        }
      }

      // Exposed JavaScript Bridge API invoked from Native Android Toolbar
      window.QubMobileBridge = {
        toggleBold: function () {
          document.execCommand('bold', false, null);
          notifySelectionChanged();
          notifyContentChanged();
        },
        toggleItalic: function () {
          document.execCommand('italic', false, null);
          notifySelectionChanged();
          notifyContentChanged();
        },
        toggleStrike: function () {
          document.execCommand('strikeThrough', false, null);
          notifySelectionChanged();
          notifyContentChanged();
        },
        toggleHeading: function (level) {
          const tag = 'H' + level;
          document.execCommand('formatBlock', false, tag);
          notifySelectionChanged();
          notifyContentChanged();
        },
        toggleBulletList: function () {
          document.execCommand('insertUnorderedList', false, null);
          notifySelectionChanged();
          notifyContentChanged();
        },
        toggleTaskList: function () {
          document.execCommand('insertUnorderedList', false, null);
          notifySelectionChanged();
          notifyContentChanged();
        },
        undo: function () {
          document.execCommand('undo', false, null);
          notifySelectionChanged();
          notifyContentChanged();
        },
        redo: function () {
          document.execCommand('redo', false, null);
          notifySelectionChanged();
          notifyContentChanged();
        },
        setContent: function (contentJson) {
          try {
            const parsed = JSON.parse(contentJson);
            if (parsed && parsed.content && parsed.content[0] && parsed.content[0].text) {
              editor.innerHTML = parsed.content[0].text;
            } else if (typeof contentJson === 'string') {
              editor.innerHTML = contentJson;
            }
          } catch (e) {
            editor.innerHTML = contentJson;
          }
          notifySelectionChanged();
        },
        getContent: function () {
          return JSON.stringify({
            type: "doc",
            content: [{ type: "paragraph", text: editor.innerHTML }]
          });
        }
      };

      editor.addEventListener('input', function () {
        notifyContentChanged();
        notifySelectionChanged();
      });

      document.addEventListener('selectionchange', function () {
        if (document.activeElement === editor) {
          notifySelectionChanged();
        }
      });

      window.addEventListener('load', function () {
        if (window.AndroidBridge && window.AndroidBridge.onEditorReady) {
          window.AndroidBridge.onEditorReady();
        }
      });
    })();
  </script>
</body>
</html>
