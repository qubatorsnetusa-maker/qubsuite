<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Qub Mobile Editor</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1f2937;
      }
      #mobile-root {
        width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }
      .ProseMirror {
        min-height: 80vh;
        outline: none;
        padding: 16px 20px 120px 20px;
        font-size: 16px;
        line-height: 1.65;
        color: #1f2937;
      }
      .ProseMirror p {
        margin: 0 0 1em 0;
      }
      .ProseMirror h1 {
        font-size: 1.85em;
        font-weight: 700;
        margin: 1.2em 0 0.5em 0;
        line-height: 1.25;
      }
      .ProseMirror h2 {
        font-size: 1.45em;
        font-weight: 600;
        margin: 1.1em 0 0.4em 0;
      }
      .ProseMirror h3 {
        font-size: 1.2em;
        font-weight: 600;
        margin: 1em 0 0.3em 0;
      }
      .ProseMirror ul, .ProseMirror ol {
        padding-left: 24px;
        margin: 0 0 1em 0;
      }
      .ProseMirror blockquote {
        border-left: 3px solid #3b82f6;
        padding-left: 14px;
        color: #4b5563;
        margin: 1em 0;
        font-style: italic;
      }
      .ProseMirror table {
        border-collapse: collapse;
        width: 100%;
        margin: 1em 0;
      }
      .ProseMirror th, .ProseMirror td {
        border: 1px solid #d1d5db;
        padding: 8px 12px;
      }
      .ProseMirror th {
        background-color: #f3f4f6;
        font-weight: 600;
      }
      .ProseMirror img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }
      .ProseMirror p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        float: left;
        color: #9ca3af;
        pointer-events: none;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="mobile-root"></div>
    <script type="module" src="/src/mobile-editor-entry.tsx"></script>
  </body>
</html>
